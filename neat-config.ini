# NEAT config, run N (clean start). Every genome starts as 16 inputs -> 32 random tanh hidden -> 4 identity outputs
# (lander/neatnet.py RandomStartGenome; why 32: results/size_*.json). From there everything evolves: weights, biases,
# new nodes, new connections, AND deleting nodes and connections (nothing is protected).
# Mutation is stronger than the old "gentle" setting (that one was for protecting a cloned pilot; a random start must
# explore): 80% of weights nudged by N(0, 0.1), 1% replaced. To be re-measured with experiments/mutation_damage.py
# once the population is good: children must not average more than ~3 points below their parent.
# Speciation: the trainer retunes compatibility_threshold every generation to keep ~12 species (with 640 connections,
# the stock threshold would put everything in one species).

[NEAT]
fitness_criterion     = max
fitness_threshold     = 100000
no_fitness_termination = True
pop_size              = 300
reset_on_extinction   = False

[RandomStartGenome]
num_inputs              = 16
num_outputs             = 4
num_hidden              = 0
feed_forward            = True
initial_connection      = full_direct

activation_default      = tanh
activation_mutate_rate  = 0.0
activation_options      = tanh
aggregation_default     = sum
aggregation_mutate_rate = 0.0
aggregation_options     = sum

bias_init_mean          = 0.0
bias_init_stdev         = 0.2
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.1
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.01

response_init_mean      = 1.0
response_init_stdev     = 0.0
response_max_value      = 30.0
response_min_value      = -30.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.0
response_replace_rate   = 0.0

weight_init_mean        = 0.0
weight_init_stdev       = 0.2
weight_max_value        = 30.0
weight_min_value        = -30.0
weight_mutate_power     = 0.1
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.01

# structure: grow and prune
node_add_prob           = 0.03
node_delete_prob        = 0.02
conn_add_prob           = 0.05
conn_delete_prob        = 0.02
enabled_default         = True
enabled_mutate_rate     = 0.0

compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient   = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 0.25

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 30
species_elitism      = 3

[DefaultReproduction]
elitism            = 3
survival_threshold = 0.2
min_species_size   = 2
